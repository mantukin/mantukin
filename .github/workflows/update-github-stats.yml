name: Update GitHub Stats Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "repo_icons/github-stats/**"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate local stats assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_STATS_USER: mantukin
        run: node scripts/update-github-stats.mjs

      - name: Commit updated assets
        run: |
          if git diff --quiet -- repo_icons/github-stats; then
            echo "No stats changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo_icons/github-stats
          git commit -m "chore: update GitHub README stats assets"
          git push
